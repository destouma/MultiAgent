<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon: overlapping chat bubbles in the persona accent colors, representing
       multiple agents talking at once. Colors match src/styles.css / personas/*.json. -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="#1C1915" />

  <!-- back-left bubble (coder accent) -->
  <rect x="40" y="76" width="108" height="76" rx="22" fill="#B45309" />
  <!-- back-right bubble (researcher accent) -->
  <rect x="108" y="58" width="112" height="78" rx="22" fill="#1D4ED8" />
  <!-- front bubble (general accent) with speech tail -->
  <path d="M 92 206 L 76 234 L 116 208 Z" fill="#0F766E" />
  <rect x="62" y="118" width="136" height="94" rx="26" fill="#0F766E" />

  <!-- typing dots -->
  <circle cx="106" cy="165" r="8" fill="#F3F0E8" />
  <circle cx="130" cy="165" r="8" fill="#F3F0E8" />
  <circle cx="154" cy="165" r="8" fill="#F3F0E8" />
</svg>

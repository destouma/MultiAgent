name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # shared/llm/*.ts imports the `openai` package; Node/tsc resolve that
      # bare specifier by walking up from shared/llm/'s own location, which
      # reaches this root-level node_modules but never desktop/'s, since
      # shared/ is a sibling of desktop/, not a descendant of it.
      - name: Install shared/ dependencies (openai)
        working-directory: .
        run: npm ci

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: desktop/sbom.cdx.json
          retention-days: 90

  package-windows:
    name: Build Windows installer
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install shared/ dependencies (openai)
        working-directory: .
        run: npm ci

      - run: npm ci

      - name: Build Windows installer
        run: npm run pack

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/release/*.exe
          retention-days: 90
